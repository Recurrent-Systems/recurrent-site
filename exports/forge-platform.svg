<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" fill="none">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2663b6"/>
    </marker>
  </defs>

  <!-- card background (white) -->
  <rect x="0.5" y="0.5" width="959" height="259" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- 1. Inputs -->
    <line x1="140" y1="35" x2="270" y2="125" stroke="#2663b6" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="140" y1="71" x2="270" y2="125" stroke="#2663b6" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="140" y1="107" x2="270" y2="125" stroke="#2663b6" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="140" y1="143" x2="270" y2="125" stroke="#2663b6" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="140" y1="179" x2="270" y2="125" stroke="#2663b6" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="140" y1="215" x2="270" y2="125" stroke="#2663b6" stroke-opacity="0.25" stroke-width="1"/>

    <rect x="20" y="20" width="120" height="30" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-opacity="0.7" stroke-dasharray="4 3"/>
    <text x="32" y="39" fill="#475569" font-size="11">Design intent</text>
    <rect x="20" y="56" width="120" height="30" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-opacity="0.7" stroke-dasharray="4 3"/>
    <text x="32" y="75" fill="#475569" font-size="11">3D scans</text>
    <rect x="20" y="92" width="120" height="30" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-opacity="0.7" stroke-dasharray="4 3"/>
    <text x="32" y="111" fill="#475569" font-size="11">Inspection reports</text>
    <rect x="20" y="128" width="120" height="30" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-opacity="0.7" stroke-dasharray="4 3"/>
    <text x="32" y="147" fill="#475569" font-size="11">CAD / GD&amp;T</text>
    <rect x="20" y="164" width="120" height="30" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-opacity="0.7" stroke-dasharray="4 3"/>
    <text x="32" y="183" fill="#475569" font-size="11">Repeatability</text>
    <rect x="20" y="200" width="120" height="30" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-opacity="0.7" stroke-dasharray="4 3"/>
    <text x="32" y="219" fill="#475569" font-size="11">Spreadsheets</text>

    <text x="80" y="248" text-anchor="middle" fill="#64748b" font-size="12">Inputs</text>

    <!-- 2. Forge -->
    <rect x="212" y="83" width="116" height="84" rx="18" fill="#14294a" stroke="#1d4f91" stroke-width="1.5"/>
    <text x="270" y="119" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Forge</text>
    <text x="270" y="140" text-anchor="middle" fill="#cbd5e1" font-size="10">connects &amp; unifies</text>
    <line x1="328" y1="125" x2="384" y2="125" stroke="#2663b6" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 3. Outputs -->
    <rect x="392" y="50" width="200" height="150" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="406" y="60" width="172" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <circle cx="422" cy="73" r="4" fill="#2663b6"/>
    <text x="438" y="77" fill="#334155" font-size="12">Detect defects earlier</text>
    <rect x="406" y="94" width="172" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <circle cx="422" cy="107" r="4" fill="#2663b6"/>
    <text x="438" y="111" fill="#334155" font-size="12">Determine root cause</text>
    <rect x="406" y="128" width="172" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <circle cx="422" cy="141" r="4" fill="#2663b6"/>
    <text x="438" y="145" fill="#334155" font-size="12">Identify trends</text>
    <rect x="406" y="162" width="172" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <circle cx="422" cy="175" r="4" fill="#2663b6"/>
    <text x="438" y="179" fill="#334155" font-size="12">Enhance traceability</text>
    <text x="492" y="248" text-anchor="middle" fill="#64748b" font-size="12">Operational Improvements</text>
    <line x1="592" y1="125" x2="678" y2="125" stroke="#2663b6" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 4. Business outcome -->
    <rect x="684" y="50" width="252" height="150" rx="16" fill="#f4f8fd" stroke="#9cc0f0"/>
    <rect x="698" y="60" width="224" height="26" rx="8" fill="#e8f0fb" stroke="#9cc0f0"/>
    <circle cx="714" cy="73" r="4" fill="#1d4f91"/>
    <text x="730" y="77" fill="#1d4f91" font-size="12" font-weight="600">Hit production goals</text>
    <rect x="698" y="94" width="224" height="26" rx="8" fill="#e8f0fb" stroke="#9cc0f0"/>
    <circle cx="714" cy="107" r="4" fill="#1d4f91"/>
    <text x="730" y="111" fill="#1d4f91" font-size="12" font-weight="600">Lower cost of quality</text>
    <rect x="698" y="128" width="224" height="26" rx="8" fill="#e8f0fb" stroke="#9cc0f0"/>
    <circle cx="714" cy="141" r="4" fill="#1d4f91"/>
    <text x="730" y="145" fill="#1d4f91" font-size="12" font-weight="600">Reduced customer risk</text>
    <rect x="698" y="162" width="224" height="26" rx="8" fill="#e8f0fb" stroke="#9cc0f0"/>
    <circle cx="714" cy="175" r="4" fill="#1d4f91"/>
    <text x="730" y="179" fill="#1d4f91" font-size="12" font-weight="600">On-time production</text>
    <text x="810" y="248" text-anchor="middle" fill="#1d4f91" font-size="12">Outcomes</text>
  </g>
</svg>
