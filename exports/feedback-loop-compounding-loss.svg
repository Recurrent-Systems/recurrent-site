<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" fill="none">
  <!-- card background (white) -->
  <rect x="0.5" y="0.5" width="899" height="375" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- eyebrow -->
    <text x="100" y="32" fill="#2663b6" fill-opacity="0.85" font-size="9.5" letter-spacing="1.5" font-family="monospace">EXAMPLE — ONE GEOMETRIC DEFECT</text>

    <!-- axes -->
    <line x1="100" y1="52" x2="100" y2="284" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="100" y1="284" x2="840" y2="284" stroke="#cbd5e1" stroke-width="1"/>
    <text x="40" y="182" transform="rotate(-90 40 182)" text-anchor="middle" fill="#64748b" font-size="10" letter-spacing="1.5" font-family="monospace">ACCUMULATED LOSS</text>
    <text x="836" y="278" text-anchor="end" fill="#94a3b8" font-size="10">time →</text>

    <!-- shaded compounding loss -->
    <path d="M100,284 C380,280 560,200 760,84 L760,259 L158,259 Q132,262 100,284 Z" fill="#e0654a" fill-opacity="0.12"/>

    <!-- without: compounding -->
    <path d="M100,284 C380,280 560,200 760,84" fill="none" stroke="#d4503a" stroke-width="2.5"/>
    <circle cx="760" cy="84" r="5" fill="#d4503a" stroke="#ffffff" stroke-width="2"/>
    <text x="752" y="72" text-anchor="end" fill="#c0392b" font-size="11" font-weight="600">Found after days/weeks of digging</text>

    <!-- with Forge: flattens -->
    <path d="M100,284 Q132,262 158,259 L760,259" fill="none" stroke="#2663b6" stroke-width="2.5"/>
    <circle cx="158" cy="259" r="5" fill="#1d4f91" stroke="#ffffff" stroke-width="2"/>
    <text x="170" y="236" fill="#1d4f91" font-size="11" font-weight="600">Rule flags it → team pinpoints in a shift</text>
    <text x="170" y="250" fill="#64748b" font-size="9.5">+ same condition surfaced on every affected part</text>

    <!-- compounding label (placed in open part of the wedge) -->
    <text x="566" y="230" text-anchor="middle" fill="#c0392b" font-size="13" font-weight="600">Compounding loss</text>
    <text x="566" y="246" text-anchor="middle" fill="#94a3b8" font-size="10.5">every part, every shift it keeps running</text>

    <!-- loop-length brackets -->
    <line x1="100" y1="294" x2="100" y2="299" stroke="#2663b6" stroke-width="1.3"/>
    <line x1="100" y1="299" x2="158" y2="299" stroke="#2663b6" stroke-width="1.3"/>
    <line x1="158" y1="294" x2="158" y2="299" stroke="#2663b6" stroke-width="1.3"/>
    <text x="129" y="313" text-anchor="middle" fill="#1d4f91" font-size="9.5">Forge loop</text>

    <line x1="100" y1="320" x2="100" y2="325" stroke="#c0392b" stroke-width="1.3"/>
    <line x1="100" y1="325" x2="760" y2="325" stroke="#c0392b" stroke-width="1.3"/>
    <line x1="760" y1="320" x2="760" y2="325" stroke="#c0392b" stroke-width="1.3"/>
    <text x="430" y="339" text-anchor="middle" fill="#c0392b" font-size="9.5">Manual loop — digging through graphs, machine PCs, spreadsheets</text>

    <!-- legend -->
    <line x1="118" y1="66" x2="138" y2="66" stroke="#2663b6" stroke-width="2.5"/>
    <text x="144" y="70" fill="#475569" font-size="11">With Forge — rules flag, team finds it fast</text>
    <line x1="118" y1="86" x2="138" y2="86" stroke="#d4503a" stroke-width="2.5"/>
    <text x="144" y="90" fill="#475569" font-size="11">Without — the team digs by hand</text>

    <!-- caption -->
    <text x="450" y="366" text-anchor="middle" fill="#64748b" font-size="12">Forge doesn't auto root-cause — it gives the team the tools to pinpoint &amp; contain it in one shift</text>
  </g>
</svg>
