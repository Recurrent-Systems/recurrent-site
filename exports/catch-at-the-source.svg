<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" fill="none">
  <defs>
    <linearGradient id="riskSpectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#89aee8"/>
      <stop offset="52%" stop-color="#e0b15a"/>
      <stop offset="100%" stop-color="#e0654a"/>
    </linearGradient>
  </defs>

  <!-- card background (white) -->
  <rect x="0.5" y="0.5" width="779" height="267" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- Top: caught at the source -->
    <rect x="60" y="40" width="392" height="48" rx="12" fill="#e8f0fb" stroke="#9cc0f0"/>
    <text x="78" y="62" fill="#1d4f91" font-size="13" font-weight="600">Forge — flagged the moment it's measured</text>
    <text x="78" y="80" fill="#475569" font-size="11">part pulled · reworked · root cause analysis started</text>
    <line x1="96" y1="88" x2="96" y2="122" stroke="#2663b6" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- spectrum bar -->
    <rect x="90" y="126" width="600" height="18" rx="9" fill="url(#riskSpectrum)" fill-opacity="0.9"/>
    <line x1="90" y1="122" x2="90" y2="148" stroke="#1e293b" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="90" y="166" text-anchor="middle" fill="#475569" font-size="11">Measured</text>
    <line x1="240" y1="122" x2="240" y2="148" stroke="#1e293b" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="240" y="166" text-anchor="middle" fill="#475569" font-size="11">Next op</text>
    <line x1="390" y1="122" x2="390" y2="148" stroke="#1e293b" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="390" y="166" text-anchor="middle" fill="#475569" font-size="11">Assembly</text>
    <line x1="540" y1="122" x2="540" y2="148" stroke="#1e293b" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="540" y="166" text-anchor="middle" fill="#475569" font-size="11">...</text>
    <line x1="690" y1="122" x2="690" y2="148" stroke="#1e293b" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="690" y="166" text-anchor="middle" fill="#475569" font-size="11">End of line</text>

    <!-- catch-point markers -->
    <circle cx="96" cy="135" r="6" fill="#1d4f91" stroke="#ffffff" stroke-width="2"/>
    <circle cx="684" cy="135" r="6" fill="#e0654a" stroke="#ffffff" stroke-width="2"/>

    <!-- Bottom: caught at end of line -->
    <rect x="372" y="180" width="348" height="48" rx="12" fill="#fdecea" stroke="#eaa593"/>
    <text x="550" y="202" text-anchor="end" fill="#c0392b" font-size="13" font-weight="600">Defect moves downstream</text>
    <text x="535" y="220" text-anchor="end" fill="#6b7280" font-size="11">scrap, heavy rework, escapes</text>
  </g>
</svg>
